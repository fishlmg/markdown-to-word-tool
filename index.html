<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Markdown 转 Word 粘贴工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    #container {
      width: 100%;
      max-width: 1300px;
    }
    h1 {text-align: center;}
    p.description {
      margin-bottom: 40px;
    }
    .editor-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      position: relative;
    }
    .editor-panel-left {
      flex: 4;
    }
    .editor-panel-right {
      flex: 5;
    }
    textarea {
      width: 100%;
      height: 550px;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      margin-left: 5px;
    }
    .buttons-container {
      text-align: right;
      margin-bottom: 10px;
    }
    .preview-container {
      height: 550px;
    }
    #preview {
      border: 1px solid #ccc;
      padding: 20px;
      height: 100%;
      overflow: auto;
      box-sizing: border-box;
    }
    table {border-collapse: collapse;}
    table, th, td {border: 1px solid #666; padding: 4px 8px;}
    footer { margin-top: 40px; text-align: center; font-size: 14px; color: #555; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="container">
    <h1>Markdown 转 Word 粘贴工具</h1>
    <p class="description">在左侧输入或粘贴您的 Markdown 文本，右侧会自动显示预览。点击"复制富文本"即可复制为富文本并直接粘贴到 Word，点击"复制HTML源码"可复制转换后的 HTML 代码。</p>

    <div class="buttons-container">
      <button id="copyBtn">复制富文本</button>
      <button id="copyHtmlBtn">复制HTML源码</button>
    </div>

    <div class="editor-container">
      <div class="editor-panel-left">
        <textarea id="markdown" placeholder="在此输入 Markdown..."></textarea>
      </div>
      <div class="editor-panel-right">
        <div class="preview-container">
          <div id="preview"></div>
        </div>
      </div>
    </div>
    <footer><p>作者：lmg_cn</p>
      <p>© 2025 lmg_cn. All rights reserved.</p>
    </footer>
  </div>

  <script>
    marked.setOptions({
      gfm: true,
      breaks: true
    });

    function convert() {
      const md = document.getElementById('markdown').value;
      const html = marked.parse(md);
      document.getElementById('preview').innerHTML = html;
    }

    function copyToClipboard() {
      const preview = document.getElementById('preview');
      const range = document.createRange();
      range.selectNodeContents(preview);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      try {
        document.execCommand('copy');
        alert('已复制到剪贴板，可直接粘贴到 Word！');
      } catch (e) {
        alert('复制失败，请手动选择并复制。');
      }
      selection.removeAllRanges();
    }

    function copyHtml() {
      const html = document.getElementById('preview').innerHTML;
      navigator.clipboard.writeText(html).then(() => {
        alert('HTML 源码已复制到剪贴板！');
      }).catch(() => {
        alert('复制失败，请手动复制。');
      });
    }

    document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
    document.getElementById('copyHtmlBtn').addEventListener('click', copyHtml);

    // 实时预览
    document.getElementById('markdown').addEventListener('input', convert);

    // 页面加载时初始化预览
    window.addEventListener('load', convert);
  </script>
</body>
</html>
